<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Select Dropdown - V27</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">
        <i class="bi bi-ui-checks me-2"></i>json-renderers-build <span class="badge bg-primary">v27</span>
      </a>
      <span class="navbar-text text-light">Select Dropdown Demo</span>
    </div>
  </nav>

  <main class="container py-2">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow-sm border-0 mb-4">
          <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div>
                <h1 class="h4 mb-1 fw-bold text-dark">Declarative &lt;select&gt; Dropdown</h1>
                <p class="text-muted small mb-0">Compiled 100% internally from <code>v27/definitions.json</code> using data-driven options.</p>
              </div>
              <a href="../index.html" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>All Samples
              </a>
            </div>

            <div class="bg-light p-4 rounded-3 border mt-3">
              <label for="Name" class="form-label fw-semibold text-secondary">Select Company / Item:</label>
              <div id="dom-render-container">
                <div class="text-center py-4 text-muted">Building select element...</div>
              </div>
              <div id="selected-feedback" class="mt-3 text-success fw-medium small"></div>
            </div>

            <div class="mt-4">
              <h6 class="fw-bold text-muted text-uppercase small">Generated JSON Spec:</h6>
              <pre id="spec-output" class="bg-dark text-light p-3 rounded-3 small font-monospace overflow-auto" style="max-height: 250px;"></pre>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="./index.js"></script>
</body>
</html>

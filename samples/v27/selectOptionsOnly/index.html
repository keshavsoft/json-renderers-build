<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Select Options Only - V27</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">
        <i class="bi bi-list-check me-2"></i>json-renderers-build <span class="badge bg-primary">v27</span>
      </a>
      <span class="navbar-text text-light">Select Options Only Demo</span>
    </div>
  </nav>

  <main class="container py-2">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow-sm border-0 mb-4">
          <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div>
                <h1 class="h4 mb-1 fw-bold text-dark">Select Options Injection</h1>
                <p class="text-muted small mb-0">Builds pure <code>&lt;option&gt;</code> elements from data and injects them into an existing DOM select.</p>
              </div>
              <a href="../index.html" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>All Samples
              </a>
            </div>

            <div class="bg-light p-4 rounded-3 border mt-3">
              <label for="selectId" class="form-label fw-semibold text-secondary">Target Select Dropdown:</label>
              <select id="selectId" class="form-select form-select-lg shadow-sm">
                <option value="" disabled selected>-- Pre-existing default option --</option>
              </select>
            </div>

            <div class="mt-4">
              <h6 class="fw-bold text-muted text-uppercase small">Generated Options Spec:</h6>
              <pre id="spec-output" class="bg-dark text-light p-3 rounded-3 small font-monospace overflow-auto" style="max-height: 250px;"></pre>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="./index.js"></script>
</body>
</html>
